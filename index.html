<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Little Kerala 3D</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
}

#title{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 6px #000;
}

#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    color:white;
    font-size:18px;
    text-shadow:0 2px 5px #000;
}

#joystick{
    position:fixed;
    left:20px;
    bottom:20px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff35;
    border:2px solid #ffffff80;
    z-index:30;
}

#stick{
    position:absolute;
    left:34px;
    top:34px;
    width:54px;
    height:54px;
    border-radius:50%;
    background:#ffffffcc;
}

#fire{
    position:fixed;
    right:25px;
    bottom:30px;
    width:82px;
    height:82px;
    border:2px solid white;
    border-radius:50%;
    background:#d32f2fdd;
    color:white;
    font-size:16px;
    font-weight:bold;
    z-index:30;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="title">🌴 LITTLE KERALA</div>

<div id="loading">
    Loading 3D Character...
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="fire">FIRE</button>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x82c8f5);

scene.fog =
    new THREE.Fog(0x82c8f5,80,220);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        60,
        innerWidth / innerHeight,
        0.1,
        500
    );

camera.position.set(
    0,
    5,
    10
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x477044,
        1.8
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    60,
    100,
    50
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);


/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            300,
            300
        ),
        new THREE.MeshStandardMaterial({
            color:0x4c9a45,
            roughness:1
        })
    );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROAD
========================= */

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            18,
            300
        ),
        new THREE.MeshStandardMaterial({
            color:0x444444,
            roughness:.9
        })
    );

road.rotation.x=-Math.PI/2;

road.position.y=.02;

road.receiveShadow=true;

scene.add(road);


/* ROAD LINES */

for(
    let z=-145;
    z<145;
    z+=12
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,
                .04,
                6
            ),
            new THREE.MeshBasicMaterial({
                color:0xffffff
            })
        );

    line.position.set(
        0,
        .05,
        z
    );

    scene.add(line);
}


/* =========================
   HOUSES
========================= */

function createHouse(x,z){

    const house =
        new THREE.Group();


    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                7,
                3.5,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0xf0d0a0
            })
        );

    wall.position.y=1.75;

    wall.castShadow=true;
    wall.receiveShadow=true;

    house.add(wall);


    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.2,
                2.8,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x9e3028
            })
        );

    roof.rotation.y=Math.PI/4;

    roof.position.y=4.8;

    roof.castShadow=true;

    house.add(roof);


    house.position.set(
        x,
        0,
        z
    );

    scene.add(house);
}


createHouse(-12,-25);
createHouse(12,-55);
createHouse(-12,-90);
createHouse(12,-125);


/* =========================
   TREES
========================= */

function createTree(x,z){

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3,
                .42,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x76502f
            })
        );

    trunk.position.y=1.5;

    trunk.castShadow=true;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x087c2c
            })
        );

    leaves.position.y=4;

    leaves.castShadow=true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


for(
    let i=0;
    i<35;
    i++
){

    const side =
        Math.random()<.5
        ? -1
        : 1;

    createTree(
        side*(13+Math.random()*15),
        -145+Math.random()*280
    );
}


/* =========================
   PLAYER
========================= */

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    12
);

scene.add(player);


/* =========================
   3D CHARACTER
========================= */

let character=null;
let mixer=null;

const loader =
    new GLTFLoader();


/*
   Public animated human model.
   Later replace this URL with
   your own GLB character.
*/

const characterURL =
"https://threejs.org/examples/models/gltf/Soldier.glb";


loader.load(

    characterURL,

    function(gltf){

        character =
            gltf.scene;

        character.scale.set(
            1.8,
            1.8,
            1.8
        );

        character.traverse(
            function(obj){

                if(obj.isMesh){

                    obj.castShadow=true;
                    obj.receiveShadow=true;

                }

            }
        );

        player.add(character);


        /* Animation */

        mixer =
            new THREE.AnimationMixer(
                character
            );


        if(
            gltf.animations &&
            gltf.animations.length
        ){

            const idle =
                mixer.clipAction(
                    gltf.animations[0]
                );

            idle.play();

        }


        document
            .getElementById("loading")
            .style.display="none";

    },

    undefined,

    function(error){

        console.error(
            "Character loading failed:",
            error
        );

        document
            .getElementById("loading")
            .innerText =
            "Character failed to load";

    }

);


/* =========================
   MOVEMENT
========================= */

let moveX=0;
let moveY=0;

let joystickActive=false;

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


function moveJoystick(e){

    const rect =
        joystick.getBoundingClientRect();


    let x =
        e.touches[0].clientX -
        (
            rect.left +
            rect.width/2
        );


    let y =
        e.touches[0].clientY -
        (
            rect.top +
            rect.height/2
        );


    const max=42;

    const distance =
        Math.sqrt(
            x*x+y*y
        );


    if(distance>max){

        x =
            x/distance*max;

        y =
            y/distance*max;

    }


    stick.style.left =
        (35+x)+"px";

    stick.style.top =
        (35+y)+"px";


    moveX=x/max;
    moveY=y/max;
}


joystick.addEventListener(
    "touchstart",
    e=>{
        joystickActive=true;
        moveJoystick(e);
    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();

        if(joystickActive)
            moveJoystick(e);
    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    ()=>{

        joystickActive=false;

        moveX=0;
        moveY=0;

        stick.style.left="35px";
        stick.style.top="35px";

    }
);


/* =========================
   SHOOT BUTTON
========================= */

document
    .getElementById("fire")
    .addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            shoot();
        },
        {passive:false}
    );


function shoot(){

    if(!character)
        return;

    console.log(
        "Player fired"
    );

    /*
       Shooting system can be expanded
       with weapon model, bullets,
       targets and hit detection.
    */
}


/* =========================
   CLOCK
========================= */

const clock =
    new THREE.Clock();


/* =========================
   GAME LOOP
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if(mixer)
        mixer.update(delta);


    /* PLAYER MOVEMENT */

    if(joystickActive){

        const speed=.10;

        player.position.x +=
            moveX*speed;

        player.position.z +=
            moveY*speed;


        if(
            Math.abs(moveX)+
            Math.abs(moveY)>.15
        ){

            player.rotation.y =
                Math.atan2(
                    moveX,
                    moveY
                );

        }

    }


    /* CAMERA FOLLOW */

    const cameraX =
        player.position.x;

    const cameraZ =
        player.position.z+10;


    camera.position.x +=
        (
            cameraX -
            camera.position.x
        )*.08;


    camera.position.z +=
        (
            cameraZ -
            camera.position.z
        )*.08;


    camera.position.y +=
        (
            5.5 -
            camera.position.y
        )*.08;


    camera.lookAt(
        player.position.x,
        1.5,
        player.position.z
    );


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
