<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Little Kerala</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{width:100vw;height:100vh}
#title{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:24px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
  z-index:5;
}
#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffffff44;
  border:2px solid #ffffff88;
  z-index:10;
}
#stick{
  position:absolute;
  left:35px;
  top:35px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffffbb;
}
</style>
</head>

<body>

<div id="title">🌴 Little Kerala</div>
<div id="game"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth/innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById("game").appendChild(renderer.domElement);

/* LIGHT */
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(50,100,50);
scene.add(sun);

scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1));

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshLambertMaterial({color:0x4caf50})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* ROAD */
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(16,300),
  new THREE.MeshLambertMaterial({color:0x555555})
);

road.rotation.x=-Math.PI/2;
road.position.y=.02;
scene.add(road);

/* ROAD LINES */
for(let z=-140;z<140;z+=10){

  const line=new THREE.Mesh(
    new THREE.BoxGeometry(.35,.03,5),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );

  line.position.set(0,.05,z);
  scene.add(line);
}

/* PLAYER */
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(1,1.5,.7),
  new THREE.MeshLambertMaterial({color:0x2196f3})
);

body.position.y=1.2;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(.45,16,16),
  new THREE.MeshLambertMaterial({color:0xffcc99})
);

head.position.y=2.25;
player.add(head);

player.position.set(0,0,10);
scene.add(player);

/* HOUSES */
function house(x,z){

  const h = new THREE.Group();

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(6,3,6),
    new THREE.MeshLambertMaterial({color:0xffe0b2})
  );

  base.position.y=1.5;
  h.add(base);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(4.8,2.5,4),
    new THREE.MeshLambertMaterial({color:0xb71c1c})
  );

  roof.rotation.y=Math.PI/4;
  roof.position.y=4;
  h.add(roof);

  h.position.set(x,0,z);
  scene.add(h);
}

/* TREES */
function tree(x,z){

  const t=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.3,.4,3,8),
    new THREE.MeshLambertMaterial({color:0x795548})
  );

  trunk.position.y=1.5;
  t.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(2,12,12),
    new THREE.MeshLambertMaterial({color:0x087f23})
  );

  leaves.position.y=4;
  t.add(leaves);

  t.position.set(x,0,z);
  scene.add(t);
}

/* VILLAGE */
house(-10,-20);
house(10,-45);
house(-10,-75);
house(10,-110);

for(let i=0;i<30;i++){

  const side=Math.random()>0.5?1:-1;
  const x=side*(12+Math.random()*15);
  const z=-140+Math.random()*280;

  tree(x,z);
}

/* JOYSTICK */
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let moving=false;
let dx=0;
let dy=0;

function moveStick(e){

  const r=joystick.getBoundingClientRect();

  let x=e.touches[0].clientX-(r.left+r.width/2);
  let y=e.touches[0].clientY-(r.top+r.height/2);

  const max=40;
  const len=Math.sqrt(x*x+y*y);

  if(len>max){
    x=x/len*max;
    y=y/len*max;
  }

  stick.style.left=(35+x)+"px";
  stick.style.top=(35+y)+"px";

  dx=x/max;
  dy=y/max;
}

joystick.addEventListener("touchstart",e=>{
  moving=true;
  moveStick(e);
});

joystick.addEventListener("touchmove",e=>{
  if(moving) moveStick(e);
});

joystick.addEventListener("touchend",()=>{
  moving=false;
  dx=0;
  dy=0;
  stick.style.left="35px";
  stick.style.top="35px";
});

/* CAMERA */
camera.position.set(0,7,16);

function animate(){

  requestAnimationFrame(animate);

  if(moving){

    player.position.x += dx*.12;
    player.position.z += dy*.12;

    player.rotation.y=Math.atan2(dx,dy);
  }

  /* CAMERA FOLLOW */

  camera.position.x +=
    (player.position.x-camera.position.x)*.08;

  camera.position.z +=
    (player.position.z+12-camera.position.z)*.08;

  camera.lookAt(
    player.position.x,
    1,
    player.position.z
  );

  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
